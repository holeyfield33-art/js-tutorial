<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Menlo, Consolas, 'Courier New', monospace" role="img" aria-labelledby="title desc">
  <title id="title">JavaScript runtime overview: source file to output</title>
  <desc id="desc">A source file, hello.js, feeds into either Node.js or a browser JavaScript engine, which produces console output. Node.js runs from a terminal via the node command and prints to the terminal. A browser runs the script via its DevTools console and prints to that console.</desc>

  <rect x="0" y="0" width="760" height="300" fill="#ffffff" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <!-- source file -->
  <rect x="20" y="120" width="150" height="60" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2" />
  <text x="95" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1b4b">hello.js</text>
  <text x="95" y="163" text-anchor="middle" font-size="11" fill="#4338ca">source file</text>

  <!-- split arrows to two engines -->
  <path d="M 170 150 L 260 80" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 170 150 L 260 220" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- Node.js box -->
  <rect x="265" y="50" width="200" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text x="365" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Node.js</text>
  <text x="365" y="96" text-anchor="middle" font-size="11" fill="#166534">run via: node hello.js</text>
  <text x="365" y="111" text-anchor="middle" font-size="11" fill="#166534">(terminal, no browser needed)</text>

  <!-- Browser box -->
  <rect x="265" y="190" width="200" height="70" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text x="365" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">Browser engine</text>
  <text x="365" y="236" text-anchor="middle" font-size="11" fill="#9a3412">run via: DevTools Console</text>
  <text x="365" y="251" text-anchor="middle" font-size="11" fill="#9a3412">(Chrome / Firefox / Edge)</text>

  <!-- arrows to output -->
  <path d="M 465 85 L 560 150" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 465 225 L 560 160" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <!-- output box -->
  <rect x="565" y="120" width="175" height="60" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2" />
  <text x="652" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Output</text>
  <text x="652" y="163" text-anchor="middle" font-size="11" fill="#374151">"Setup successful!"</text>

  <!-- caption -->
  <text x="380" y="290" text-anchor="middle" font-size="11" fill="#6b7280">Same source file, two possible runtimes — pick either one, the result is identical.</text>
</svg>

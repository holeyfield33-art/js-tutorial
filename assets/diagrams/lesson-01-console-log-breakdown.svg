<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="840" height="340" font-family="Menlo, Consolas, 'Courier New', monospace" role="img" aria-labelledby="title desc">
  <title id="title">console.log("Hello, World!"); broken into its parts</title>
  <desc id="desc">The statement console.log("Hello, World!"); annotated part by part: console is a built-in object available in both the browser and Node.js, .log is a method belonging to that object, "Hello, World!" is a string literal passed as the argument, and the semicolon ends the statement. An arrow shows the whole statement producing the terminal output Hello, World!</desc>

  <rect x="0" y="0" width="840" height="340" fill="#ffffff" />

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <!-- the code line, monospaced, each token in its own tspan for alignment -->
  <text x="30" y="55" font-size="24" fill="#111827" xml:space="preserve">console<tspan fill="#c2410c">.log</tspan>(<tspan fill="#15803d">"Hello, World!"</tspan>)<tspan fill="#4338ca">;</tspan></text>

  <!-- console callout: box A, x 30-210 -->
  <path d="M 82 65 L 100 100" stroke="#1e1b4b" stroke-width="1.5" fill="none" marker-end="url(#arrow2)" />
  <rect x="30" y="105" width="180" height="75" rx="6" fill="#eef2ff" stroke="#1e1b4b" stroke-width="2" />
  <text x="120" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e1b4b">console</text>
  <text x="120" y="146" text-anchor="middle" font-size="10.5" fill="#312e81">built-in object</text>
  <text x="120" y="161" text-anchor="middle" font-size="10.5" fill="#312e81">in browsers + Node.js</text>

  <!-- .log callout: box B, x 225-415 -->
  <path d="M 164 65 L 320 100" stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#arrow2)" />
  <rect x="225" y="105" width="190" height="75" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text x="320" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">.log()</text>
  <text x="320" y="146" text-anchor="middle" font-size="10.5" fill="#9a3412">a method &#8212; a function</text>
  <text x="320" y="161" text-anchor="middle" font-size="10.5" fill="#9a3412">that belongs to console</text>

  <!-- string literal callout: box C, x 430-615 -->
  <path d="M 320 65 L 522 100" stroke="#15803d" stroke-width="1.5" fill="none" marker-end="url(#arrow2)" />
  <rect x="430" y="105" width="185" height="75" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text x="522" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">"Hello, World!"</text>
  <text x="522" y="146" text-anchor="middle" font-size="10.5" fill="#166534">a string literal &#8212; the</text>
  <text x="522" y="161" text-anchor="middle" font-size="10.5" fill="#166534">argument to .log()</text>

  <!-- semicolon callout: box D, x 630-790 -->
  <path d="M 454 65 L 710 100" stroke="#4338ca" stroke-width="1.5" fill="none" marker-end="url(#arrow2)" />
  <rect x="630" y="105" width="160" height="75" rx="6" fill="#ede9fe" stroke="#4338ca" stroke-width="2" />
  <text x="710" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#312e81">;</text>
  <text x="710" y="146" text-anchor="middle" font-size="10.5" fill="#3730a3">ends the statement</text>
  <text x="710" y="161" text-anchor="middle" font-size="10.5" fill="#3730a3">(ASI can infer it)</text>

  <!-- arrow down to output -->
  <path d="M 410 200 L 410 235" stroke="#333333" stroke-width="2" fill="none" marker-end="url(#arrow2)" />
  <text x="425" y="222" font-size="11" fill="#374151">runs</text>

  <!-- output terminal box -->
  <rect x="300" y="245" width="220" height="70" rx="6" fill="#111827" />
  <text x="320" y="270" font-size="13" fill="#4ade80">$ node hello.js</text>
  <text x="320" y="292" font-size="13" fill="#e5e7eb">Hello, World!</text>
</svg>
